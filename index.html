<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f1ea">
<meta name="description" content="Enter a birthday, get a read of the friction your build repeats.">
<title>Hardware Read</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#f4f1ea;
    --bg-soft:#ece5d6;
    --ink:#2b2620;
    --muted:#8c8170;
    --line:#e2dac9;
    --accent:#a4533b;
    --accent-ink:#8a4330;
    --err:#9a4b3a;
    --serif:'Spectral', Georgia, 'Times New Roman', serif;
    --sans:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    min-height:100vh;
  }

  .wrap{
    max-width:640px;
    margin:0 auto;
    padding:28px 22px calc(140px + env(safe-area-inset-bottom));
  }

  /* ---- header ---- */
  header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
    margin-bottom:8px;
  }
  .brand{
    font-family:var(--serif);
    font-weight:500;
    font-size:1.25rem;
    letter-spacing:.01em;
    margin:0;
  }
  .brand .dot{color:var(--accent);}
  .restart{
    border:0;background:none;cursor:pointer;
    font-family:var(--sans);font-size:.8rem;color:var(--muted);
    padding:4px 2px;display:none;
  }
  .restart:hover{color:var(--ink);}
  .head-right{ display:flex; align-items:center; gap:10px; }
  .modeltoggle{
    display:inline-flex;
    border:1px solid var(--line);
    border-radius:8px;
    overflow:hidden;
    background:#fbf9f3;
  }
  .modeltoggle button{
    border:0; background:transparent; cursor:pointer;
    font-family:var(--sans); font-size:.74rem; color:var(--muted);
    padding:6px 11px; transition:background .15s ease, color .15s ease;
  }
  .modeltoggle button.active{ background:var(--ink); color:#f6f2e9; }
  .modeltoggle button:not(.active):hover{ color:var(--ink); }

  /* ---- intro ---- */
  #intro{ margin-top:14vh; transition:opacity .5s ease, transform .5s ease; }
  #intro.leaving{ opacity:0; transform:translateY(-10px); pointer-events:none; }

  .lede{
    font-family:var(--serif);
    font-size:1.22rem;
    line-height:1.5;
    color:var(--ink);
    margin:0 0 30px;
    max-width:30ch;
  }
  .lede .soft{ color:var(--muted); }

  .field-label{
    display:block;
    font-size:.72rem;
    letter-spacing:.09em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:10px;
  }
  .dob{
    display:flex;
    align-items:flex-end;
    gap:10px;
    margin-bottom:26px;
  }
  .dob input{
    font-family:var(--serif);
    font-size:1.55rem;
    color:var(--ink);
    background:transparent;
    border:0;
    border-bottom:1.5px solid var(--line);
    padding:6px 2px;
    text-align:center;
    width:100%;
    border-radius:0;
    transition:border-color .2s ease;
    -moz-appearance:textfield;
  }
  .dob input::-webkit-outer-spin-button,
  .dob input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  .dob .f-year{ flex:1.6; }
  .dob .f-month,.dob .f-day{ flex:1; }
  .dob input::placeholder{ color:#c4baa7; }
  .dob input:focus{ outline:none; border-bottom-color:var(--accent); }
  .dob .sep{
    font-family:var(--serif);
    font-size:1.4rem;
    color:#cabfa9;
    padding-bottom:10px;
  }

  .go{
    appearance:none;
    border:0;
    background:var(--ink);
    color:#f6f2e9;
    font-family:var(--sans);
    font-size:1rem;
    font-weight:500;
    letter-spacing:.02em;
    padding:15px 22px;
    width:100%;
    border-radius:10px;
    cursor:pointer;
    transition:background .2s ease, opacity .2s ease;
  }
  .go:hover{ background:#3a342b; }
  .go:disabled{ opacity:.55; cursor:default; }

  .form-error{
    color:var(--err);
    font-size:.9rem;
    margin-top:14px;
    min-height:1em;
  }

  /* ---- thread ---- */
  #thread{ display:none; flex-direction:column; gap:26px; margin-top:6px; }

  .read{
    font-family:var(--serif);
    font-size:1.16rem;
    line-height:1.78;
    color:var(--ink);
    white-space:pre-wrap;
    word-wrap:break-word;
  }
  .read.first{ font-size:1.2rem; }

  .read-tag{
    font-size:.66rem; letter-spacing:.1em; text-transform:uppercase;
    color:var(--muted); margin-bottom:7px; font-family:var(--sans);
  }

  .turn{ display:flex; flex-direction:column; gap:20px; }

  .friction{
    align-self:flex-end;
    max-width:86%;
    background:var(--bg-soft);
    color:var(--ink);
    font-family:var(--sans);
    font-size:.97rem;
    line-height:1.5;
    padding:12px 15px;
    border-radius:14px 14px 4px 14px;
    white-space:pre-wrap;
    word-wrap:break-word;
  }

  /* word-reveal */
  .w{ display:inline; opacity:0; animation:fadeword .55s ease forwards; }
  @keyframes fadeword{ to{ opacity:1; } }

  /* thinking dots */
  .dots{ display:inline-flex; gap:6px; padding:4px 0; }
  .dots span{
    width:7px;height:7px;border-radius:50%;
    background:var(--muted);opacity:.35;
    animation:pulse 1.3s ease-in-out infinite;
  }
  .dots span:nth-child(2){ animation-delay:.18s; }
  .dots span:nth-child(3){ animation-delay:.36s; }
  @keyframes pulse{ 0%,100%{opacity:.25;transform:translateY(0);} 50%{opacity:.85;transform:translateY(-3px);} }

  .err-block{ color:var(--err); font-family:var(--sans); font-size:.95rem; line-height:1.55; }
  .retry{
    display:inline-block;margin-top:8px;
    border:0;background:none;cursor:pointer;
    color:var(--accent-ink);font-family:var(--sans);font-size:.9rem;
    text-decoration:underline;text-underline-offset:3px;padding:2px 0;
  }

  /* ---- composer ---- */
  #composer{
    position:fixed;
    left:0;right:0;bottom:0;
    display:none;
    background:linear-gradient(to top, var(--bg) 78%, rgba(244,241,234,0));
    padding:14px 22px calc(16px + env(safe-area-inset-bottom));
  }
  .composer-inner{
    max-width:640px;margin:0 auto;
    display:flex;align-items:flex-end;gap:10px;
    background:#fbf9f3;
    border:1.5px solid var(--line);
    border-radius:16px;
    padding:8px 8px 8px 14px;
    box-shadow:0 6px 22px rgba(80,66,40,.07);
  }
  #friction{
    flex:1;
    border:0;background:transparent;
    font-family:var(--sans);font-size:1rem;color:var(--ink);
    line-height:1.45;
    resize:none;
    max-height:120px;
    padding:8px 0;
  }
  #friction:focus{ outline:none; }
  #friction::placeholder{ color:var(--muted); }
  .send{
    flex:0 0 auto;
    width:40px;height:40px;border:0;border-radius:11px;
    background:var(--ink);color:#f6f2e9;cursor:pointer;
    font-size:1.1rem;line-height:1;
    display:flex;align-items:center;justify-content:center;
    transition:background .2s ease, opacity .2s ease;
  }
  .send:hover{ background:#3a342b; }
  .send:disabled{ opacity:.45; cursor:default; }

  .footnote{
    text-align:center;color:var(--muted);font-size:.74rem;
    margin-top:8px;
  }

  @media (max-width:420px){
    #intro{ margin-top:9vh; }
    .lede{ font-size:1.12rem; }
    .dob input{ font-size:1.35rem; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1 class="brand">Hardware Read<span class="dot">.</span></h1>
      <div class="head-right">
        <div class="modeltoggle" id="modelToggle" role="group" aria-label="Choose model">
          <button type="button" data-engine="claude" class="active">Claude</button>
          <button type="button" data-engine="gemini">Gemini</button>
        </div>
        <button class="restart" id="restart" type="button">start over</button>
      </div>
    </header>

    <!-- Intro: date of birth -->
    <section id="intro">
      <p class="lede">Type your date of birth. You'll get a read of the friction your build repeats.<span class="soft"> No time needed.</span></p>

      <form id="dobForm" novalidate>
        <span class="field-label">Date of birth</span>
        <div class="dob">
          <input class="f-year"  id="year"  inputmode="numeric" autocomplete="off" maxlength="4" placeholder="YYYY" aria-label="Birth year">
          <span class="sep">/</span>
          <input class="f-month" id="month" inputmode="numeric" autocomplete="off" maxlength="2" placeholder="MM" aria-label="Birth month">
          <span class="sep">/</span>
          <input class="f-day"   id="day"   inputmode="numeric" autocomplete="off" maxlength="2" placeholder="DD" aria-label="Birth day">
        </div>
        <button class="go" id="go" type="submit">Read my build</button>
        <div class="form-error" id="formError" role="alert"></div>
      </form>
    </section>

    <!-- Reading + inquiry thread -->
    <section id="thread" aria-live="polite"></section>
  </div>

  <!-- Sticky friction composer -->
  <div id="composer">
    <div class="composer-inner">
      <textarea id="friction" rows="1" placeholder="Bring a real-life friction." aria-label="Bring a real-life friction"></textarea>
      <button class="send" id="send" type="button" aria-label="Send">↑</button>
    </div>
    <div class="footnote">A hypothesis about your build — not a verdict.</div>
  </div>

<script>
(function(){
  "use strict";

  const API = "/api/chat";

  // --- state ---
  let birthday = null;          // {year, month, day}
  let messages = [];            // committed conversation: [{role, content}], assistant read first
  let busy = false;
  let engine = "claude";        // which model to call: "claude" | "gemini"

  // --- elements ---
  const $ = (id) => document.getElementById(id);
  const introEl   = $("intro");
  const threadEl  = $("thread");
  const composer  = $("composer");
  const formError = $("formError");
  const yearEl = $("year"), monthEl = $("month"), dayEl = $("day");
  const goBtn  = $("go");
  const fricEl = $("friction");
  const sendBtn= $("send");
  const restartBtn = $("restart");
  const modelToggle = $("modelToggle");

  // model toggle — pick which engine the next call uses
  modelToggle.querySelectorAll("button").forEach((b) => {
    b.addEventListener("click", () => {
      engine = b.dataset.engine === "gemini" ? "gemini" : "claude";
      modelToggle.querySelectorAll("button").forEach((x) => {
        x.classList.toggle("active", x === b);
      });
    });
  });

  // --- helpers ---
  function digitsOnly(el, max){
    el.value = el.value.replace(/\D/g, "").slice(0, max);
  }
  yearEl.addEventListener("input", () => { digitsOnly(yearEl,4); if(yearEl.value.length===4) monthEl.focus(); });
  monthEl.addEventListener("input", () => { digitsOnly(monthEl,2); if(monthEl.value.length===2) dayEl.focus(); });
  dayEl.addEventListener("input",  () => digitsOnly(dayEl,2));

  function nearBottom(){
    return (window.innerHeight + window.scrollY) >= (document.body.offsetHeight - 220);
  }
  function keepBottom(){
    if(nearBottom()) window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
  }

  // Gentle word-by-word reveal. Returns a promise that resolves when done.
  function reveal(el, text){
    return new Promise((resolve) => {
      el.textContent = "";
      el.classList.add("revealing");
      const tokens = text.split(/(\s+)/);
      const words = tokens.filter(t => t.trim() !== "").length || 1;
      const per = Math.max(16, Math.min(52, 2400 / words));
      let i = 0;
      function step(){
        if(i >= tokens.length){ el.classList.remove("revealing"); resolve(); return; }
        const tok = tokens[i++];
        if(tok === ""){ step(); return; }
        if(/^\s+$/.test(tok)){
          el.appendChild(document.createTextNode(tok));
          step();
        } else {
          const s = document.createElement("span");
          s.className = "w";
          s.textContent = tok;
          el.appendChild(s);
          keepBottom();
          setTimeout(step, per);
        }
      }
      step();
    });
  }

  function loadingBlock(){
    const wrap = document.createElement("div");
    const tag = document.createElement("div");
    tag.className = "read-tag";
    tag.textContent = engine === "gemini" ? "Gemini" : "Claude";
    const read = document.createElement("div");
    read.className = "read";
    read.innerHTML = '<span class="dots"><span></span><span></span><span></span></span>';
    wrap.appendChild(tag);
    wrap.appendChild(read);
    wrap.readEl = read;
    return wrap;
  }

  function setBusy(state){
    busy = state;
    sendBtn.disabled = state;
    fricEl.disabled = state;
    goBtn.disabled = state;
  }

  // Core call. `assistantEl` is the block to fill. `outgoing` is the messages
  // array to send. `onSuccess(reply)` commits state on success.
  async function callEngine(outgoing, assistantEl, isFirst, onSuccess){
    setBusy(true);
    let data = null, ok = false;
    try{
      const res = await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          year: birthday.year, month: birthday.month, day: birthday.day,
          engine: engine,
          messages: outgoing
        })
      });
      ok = res.ok;
      data = await res.json().catch(() => null);
    }catch(e){
      data = null; ok = false;
    }

    if(ok && data && data.reply){
      assistantEl.innerHTML = "";
      if(isFirst) assistantEl.classList.add("first");
      onSuccess(data.reply);
      await reveal(assistantEl, data.reply);
      keepBottom();
    } else {
      const msg = (data && data.error) ? data.error
                  : "The read couldn't reach the engine. Check your connection and try again.";
      assistantEl.innerHTML = "";
      const e = document.createElement("div");
      e.className = "err-block";
      e.textContent = msg;
      const retry = document.createElement("button");
      retry.className = "retry";
      retry.type = "button";
      retry.textContent = "Try again";
      retry.addEventListener("click", () => {
        if(busy) return;
        callEngine(outgoing, assistantEl, isFirst, onSuccess);
      });
      e.appendChild(document.createElement("br"));
      e.appendChild(retry);
      assistantEl.appendChild(e);
    }
    setBusy(false);
    if(!busy) fricEl.focus();
  }

  // --- initial read ---
  function startReading(){
    const y = parseInt(yearEl.value, 10);
    const m = parseInt(monthEl.value, 10);
    const d = parseInt(dayEl.value, 10);

    if(!yearEl.value || !monthEl.value || !dayEl.value){
      formError.textContent = "Enter your year, month, and day of birth.";
      return;
    }
    if(isNaN(y) || isNaN(m) || isNaN(d) || y<1900 || y>2100 || m<1 || m>12 || d<1 || d>31){
      formError.textContent = "That date doesn't look right. Check it and try again.";
      return;
    }
    formError.textContent = "";
    birthday = { year:y, month:m, day:d };

    // collapse the intro, reveal the thread + composer
    introEl.classList.add("leaving");
    setTimeout(() => { introEl.style.display = "none"; }, 480);
    threadEl.style.display = "flex";
    composer.style.display = "block";
    restartBtn.style.display = "inline-block";

    const block = loadingBlock();
    threadEl.appendChild(block);
    keepBottom();

    callEngine([], block.readEl, true, (reply) => {
      messages = [{ role:"assistant", content:reply }];
    });
  }

  // --- follow-up friction ---
  function sendFriction(){
    if(busy) return;
    const text = fricEl.value.trim();
    if(!text) return;

    fricEl.value = "";
    autoGrow();

    const turn = document.createElement("div");
    turn.className = "turn";
    const fric = document.createElement("div");
    fric.className = "friction";
    fric.textContent = text;
    const block = loadingBlock();
    turn.appendChild(fric);
    turn.appendChild(block);
    threadEl.appendChild(turn);
    keepBottom();

    const outgoing = messages.concat([{ role:"user", content:text }]);
    callEngine(outgoing, block.readEl, false, (reply) => {
      messages = outgoing.concat([{ role:"assistant", content:reply }]);
    });
  }

  // --- composer behaviour ---
  function autoGrow(){
    fricEl.style.height = "auto";
    fricEl.style.height = Math.min(fricEl.scrollHeight, 120) + "px";
  }
  fricEl.addEventListener("input", autoGrow);
  fricEl.addEventListener("keydown", (e) => {
    if(e.key === "Enter" && !e.shiftKey){
      e.preventDefault();
      sendFriction();
    }
  });
  sendBtn.addEventListener("click", sendFriction);

  $("dobForm").addEventListener("submit", (e) => { e.preventDefault(); startReading(); });
  restartBtn.addEventListener("click", () => location.reload());
})();
</script>
</body>
</html>
