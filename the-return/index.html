<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Return — Agnostic Node Canvas</title>
<style>
  :root {
    --bg: #0c1015;
    --grid: #161c24;
    --panel: #11161d;
    --panel-2: #161c24;
    --line: #232c38;
    --line-strong: #33414f;
    --ink: #e8eef5;
    --muted: #8a98a8;
    --faint: #5b6776;
    --amber: #f0a202;      /* the mechanism / wedge */
    --blue: #4aa8ff;       /* head / structural-risk */
    --orange: #ff7a45;     /* gut / physical-action */
    --pink: #ff5d8f;       /* heart */
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--ink);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ---- Top bar ---------------------------------------------------------- */
  .topbar {
    position: fixed; top: 0; left: 0; right: 0; height: 56px; z-index: 50;
    display: flex; align-items: center; gap: 16px; padding: 0 18px;
    background: rgba(13,17,22,0.86); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand b { font-size: 15px; letter-spacing: 0.3px; }
  .brand .feature { font-family: var(--mono); font-size: 11px; color: var(--amber); letter-spacing: 0.5px; }
  .topbar .sep { width: 1px; height: 24px; background: var(--line); }
  .hint { font-size: 12px; color: var(--muted); }
  .hint b { color: var(--ink); font-weight: 600; }
  .spacer { flex: 1; }
  .legend { display: flex; gap: 14px; }
  .legend .chip { display: flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
  .legend .dot { width: 8px; height: 8px; border-radius: 50%; }
  .btn {
    font-family: var(--sans); font-size: 12.5px; color: var(--ink);
    background: var(--panel-2); border: 1px solid var(--line-strong);
    padding: 7px 12px; border-radius: 7px; cursor: pointer; transition: all .12s ease;
  }
  .btn:hover { border-color: var(--muted); background: #1b232d; }
  .btn.ghost { background: transparent; }

  /* ---- Canvas ----------------------------------------------------------- */
  #canvas {
    position: absolute; inset: 56px 0 0 0; overflow: hidden;
    background-color: var(--bg);
    background-image:
      radial-gradient(circle, var(--grid) 1.1px, transparent 1.1px);
    background-size: 26px 26px;
    cursor: default;
  }
  #wires { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
  #wires path { fill: none; stroke: var(--line-strong); stroke-width: 2; }
  #wires path.flow { stroke: var(--amber); stroke-width: 2.2; stroke-dasharray: 5 5; opacity: .9; }

  /* ---- Nodes ------------------------------------------------------------ */
  .node {
    position: absolute; z-index: 2; width: 300px;
    background: var(--panel); border: 1px solid var(--line-strong);
    border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.45);
    user-select: none; animation: pop .18s ease;
    --accent: var(--faint);
  }
  @keyframes pop { from { opacity: 0; transform: scale(.96) translateY(6px); } to { opacity: 1; transform: none; } }
  .node.linkable { outline: 2px dashed var(--amber); outline-offset: 3px; cursor: crosshair; }
  .node__head {
    display: flex; align-items: center; gap: 8px; padding: 9px 10px 9px 12px;
    cursor: grab; border-bottom: 1px solid var(--line); border-radius: 12px 12px 0 0;
    background: linear-gradient(180deg, rgba(255,255,255,.025), transparent);
  }
  .node__head:active { cursor: grabbing; }
  .node__tag {
    font-family: var(--mono); font-size: 10px; letter-spacing: .8px; text-transform: uppercase;
    color: #0c1015; background: var(--accent); padding: 3px 7px; border-radius: 5px; font-weight: 700;
  }
  .node__readout { font-family: var(--mono); font-size: 10px; color: var(--muted); letter-spacing: .3px; }
  .node__spacer { flex: 1; }
  .node__btn {
    font-family: var(--mono); font-size: 11px; color: var(--muted); background: transparent;
    border: 1px solid var(--line); border-radius: 5px; width: 22px; height: 22px; cursor: pointer;
    line-height: 1; display: flex; align-items: center; justify-content: center;
  }
  .node__btn:hover { color: var(--ink); border-color: var(--line-strong); }
  .node__body { padding: 11px 12px 13px; }
  .node textarea {
    width: 100%; resize: none; background: transparent; border: none; outline: none;
    color: var(--ink); font-family: var(--sans); font-size: 13.5px; line-height: 1.5;
    min-height: 58px; overflow: hidden;
  }
  .node textarea::placeholder { color: var(--faint); }
  .node__prompt {
    font-size: 13.5px; line-height: 1.55; color: var(--ink);
    border-left: 2px solid var(--amber); padding-left: 11px; margin-bottom: 11px;
  }
  .node__prompt .lead { color: var(--amber); font-family: var(--mono); font-size: 10px; letter-spacing: .6px; text-transform: uppercase; display: block; margin-bottom: 6px; }
  .row { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
  .cta {
    font-family: var(--sans); font-size: 12.5px; font-weight: 600; color: #0c1015;
    background: var(--accent); border: none; padding: 8px 13px; border-radius: 7px; cursor: pointer;
    transition: filter .12s ease;
  }
  .cta:hover { filter: brightness(1.08); }
  .cta[disabled] { opacity: .4; cursor: not-allowed; }
  .kbd { font-family: var(--mono); font-size: 10.5px; color: var(--faint); }

  /* accent variants */
  .node.t-friction { --accent: #c7d2de; }
  .node.t-wedge { --accent: var(--amber); border-color: rgba(240,162,2,.55); }
  .node.t-wedge .node__head { background: linear-gradient(180deg, rgba(240,162,2,.12), transparent); }
  .node.t-physical-action { --accent: var(--orange); }
  .node.t-structural-risk { --accent: var(--blue); }
  .node.t-free { --accent: #7f8c9b; }

  .scorebar { display: flex; gap: 3px; margin-top: 10px; }
  .scorebar .seg { height: 4px; border-radius: 2px; background: var(--line); flex: 1; position: relative; overflow: hidden; }
  .scorebar .seg i { position: absolute; inset: 0; transform-origin: left; }

  .empty-hint {
    position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%);
    font-family: var(--mono); font-size: 11px; color: var(--faint); pointer-events: none;
    text-align: center; line-height: 1.7;
  }
  .empty-hint .k { color: var(--muted); }
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand"><b>THE RETURN</b><span class="feature">/ agnostic node canvas</span></div>
    <div class="sep"></div>
    <div class="hint" id="hint"><b>1.</b> Dump the raw friction → <b>Run the Silent Read</b>. The canvas wedges you into a different processing centre.</div>
    <div class="spacer"></div>
    <div class="legend">
      <span class="chip"><span class="dot" style="background:var(--blue)"></span>Head</span>
      <span class="chip"><span class="dot" style="background:var(--pink)"></span>Heart</span>
      <span class="chip"><span class="dot" style="background:var(--orange)"></span>Gut</span>
    </div>
    <div class="sep"></div>
    <button class="btn ghost" id="resetBtn">Reset canvas</button>
  </div>

  <div id="canvas">
    <svg id="wires"></svg>
    <div class="empty-hint" id="emptyHint">
      <span class="k">double-click</span> empty space to drop a free node ·
      <span class="k">drag</span> a node header to move ·
      <span class="k">⛓ link</span> to connect
    </div>
  </div>

<script>
/* =============================================================================
   THE SILENT READ  —  mirrored verbatim from classifier.js (single source of
   truth). Keep the two in sync. Exposed as window.SilentRead.
   ============================================================================= */
(function (root, factory) {
  var api = factory();
  if (root) { root.SilentRead = api; }
})(window, function () {
  'use strict';

  var WEDGES = {
    HEAD: {
      from: 'HEAD', to: 'GUT', label: 'Head', gloss: 'mapping · logic · prediction',
      prompt: 'You have mapped the logic. Now, where does this exact friction hit the ground? Add a physical action node.',
      responseType: 'physical-action', responseLabel: 'Physical Action', cta: 'Add physical action node'
    },
    GUT: {
      from: 'GUT', to: 'HEAD', label: 'Gut', gloss: 'impact · drive · barrier',
      prompt: 'You have mapped the impact. Now, what is the predictive simulation if this fails? Add a structural risk node.',
      responseType: 'structural-risk', responseLabel: 'Structural Risk', cta: 'Add structural risk node'
    },
    HEART: {
      from: 'HEART', to: 'GUT', label: 'Heart', gloss: 'resonance · relation · status',
      prompt: 'You have mapped the relational charge. Now, where does this friction land in the body — and what single physical action can your hands take? Add a physical action node.',
      responseType: 'physical-action', responseLabel: 'Physical Action', cta: 'Add physical action node'
    }
  };

  var LEXICONS = {
    HEAD: {
      'think':1,'thinking':1,'thought':1,'thoughts':1,'overthink':2,'overthinking':2,'analyze':2,'analyse':2,'analyzing':2,'analysing':2,'analysis':2,'analytical':2,'logic':2,'logical':2,'rational':1,'reason':1,'reasons':1,'figure':1,'plan':1.5,'planning':1.5,'plans':1,'strategy':1.5,'strategize':2,'predict':2,'prediction':2,'predictive':2,'forecast':2,'simulate':2,'simulation':2,'scenario':2,'scenarios':2,'variable':2,'variables':2,'option':1.5,'options':1.5,'risk':2,'risks':2,'risky':1.5,'uncertain':2,'uncertainty':2,'unsure':1.5,'decide':1.5,'decision':1.5,'decisions':1.5,'calculate':1.5,'probability':2,'odds':1.5,'contingency':2,'model':1,'map':1.5,'mapping':1.5,'framework':1.5,'organize':1.5,'organise':1.5,'prioritize':1.5,'prioritise':1.5,'timeline':1.5,'deadline':1,'schedule':1,'data':1.5,'numbers':1,'metrics':1.5,'worry':1.5,'worried':1.5,'worrying':1.5,'anxious':2,'anxiety':2,'nervous':1.5,'spiral':1.5,'spiraling':1.5,'spiralling':1.5,'ruminate':2,'ruminating':2,'complexity':1.5,'complicated':1.5,'confusing':1.5,'confused':1.5,'understand':1,'knowledge':1,'information':1,'consider':1,'considering':1,'evaluate':1.5,'assess':1.5
    },
    HEART: {
      'feel':1.5,'feeling':1.5,'feelings':1.5,'felt':1.5,'emotion':1.5,'emotions':1.5,'emotional':1.5,'hurt':1.5,'sad':1.5,'lonely':2,'alone':1.5,'love':2,'loved':1.5,'unloved':2,'care':1.5,'cares':1.5,'caring':1.5,'friend':2,'friends':2,'friendship':2,'family':2,'partner':2,'wife':2,'husband':2,'boyfriend':2,'girlfriend':2,'mother':1.5,'father':1.5,'mom':1.5,'mum':1.5,'dad':1.5,'parent':1.5,'parents':1.5,'boss':1.5,'manager':1.5,'colleague':2,'colleagues':2,'coworker':2,'coworkers':2,'team':1.5,'client':1.5,'clients':1.5,'relationship':2,'relationships':2,'connection':2,'connect':1.5,'disconnected':2,'trust':1.5,'betray':2,'betrayed':2,'rejected':2,'rejection':2,'abandon':2,'abandoned':2,'ashamed':2,'shame':2,'guilt':1.5,'guilty':1.5,'embarrass':2,'embarrassed':2,'humiliated':2,'judged':2,'judge':1.5,'judgment':1.5,'judgement':1.5,'approval':2,'respect':1.5,'respected':1.5,'disrespect':2,'disrespected':2,'status':2,'reputation':2,'belong':2,'belonging':2,'excluded':2,'ignored':2,'unseen':2,'unheard':2,'dismissed':1.5,'appreciate':1.5,'appreciated':1.5,'unappreciated':2,'resent':2,'resentment':2,'resentful':2,'disappointed':1.5,'disappoint':1.5,'awkward':1.5,'vibe':2,'mood':1.5
    },
    GUT: {
      'stuck':2,'blocked':2,'block':1.5,'barrier':2,'barriers':2,'wall':1.5,'obstacle':1.5,'obstacles':1.5,'push':1.5,'pushing':1.5,'force':1.5,'forcing':1.5,'grind':2,'grinding':2,'slog':2,'drag':1.5,'dragging':1.5,'exhausted':2,'exhausting':2,'tired':1.5,'drained':2,'draining':2,'fatigue':1.5,'burnout':2,'sluggish':2,'heavy':1.5,'slow':1.5,'stall':1.5,'stalled':2,'frozen':2,'paralyzed':2,'paralysed':2,'paralysis':2,'restless':1.5,'antsy':1.5,'body':1.5,'gut':1.5,'stomach':1.5,'chest':1.5,'jaw':1.5,'shoulders':1.5,'tense':1.5,'tight':1.5,'clench':2,'clenched':2,'knot':1.5,'pain':1.5,'ache':1.5,'sweat':1.5,'angry':2,'anger':2,'mad':1.5,'rage':2,'furious':2,'pissed':2,'frustrated':2,'frustration':2,'frustrating':2,'irritated':1.5,'annoyed':1.5,'annoying':1.5,'inefficient':2,'inefficiency':2,'waste':1.5,'wasting':1.5,'bottleneck':2,'momentum':1.5,'action':1.5,'execute':1.5,'ship':1.5,'urgent':1.5,'overwhelmed':1.5
    }
  };

  var PHRASES = {
    HEAD: { 'what if':3,'plan b':2,'figure out':2,'figure it out':2,'racing thoughts':2,"don't know":1.5,'do not know':1.5,'not sure':1.5,'going to':0.6,'worst case':2,'second guess':2,'second-guess':2,'what could':1.2,'play out':1.2 },
    HEART: { 'left out':2,'let down':1.5,'looked down':2,'looking down':2,'cut off':1.2,'falling out':1.5,'they think':1.5,'no one':1.2,'nobody':1.2,'pushed away':1.5 },
    GUT: { 'push through':2.5,'pushing through':2.5,"can't move":2.5,'cannot move':2.5,'fed up':2,'pissed off':2.5,'sick of':1.5,'had enough':2,'get it done':2,'take action':2,'waste of time':2,'spinning my wheels':2.5,'hit a wall':2.5,'burned out':2,'burnt out':2,'dead weight':1.5 }
  };

  var PEOPLE = ['you','your','yours','he','him','his','she','her','hers','they','them','their','theirs','we','us','our','everyone','someone','somebody','people'];
  var MODALS = ['will','would','could','should','might','may','if','whether','perhaps','maybe','suppose','probably','possibly'];

  function tokenize(s){ return (s.toLowerCase().match(/[a-z']+/g) || []); }
  function countPhrase(lower, phrase){
    var esc = phrase.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    var re = new RegExp('(^|[^a-z])'+esc+'(?![a-z])','g');
    var c=0; while(re.exec(lower)!==null){ c++; if(c>5){break;} } return c;
  }

  function classify(text){
    text = (text==null) ? '' : String(text);
    var lower = text.toLowerCase();
    var tokens = tokenize(text);
    var counts = Object.create(null), i;
    for(i=0;i<tokens.length;i++){ counts[tokens[i]] = (counts[tokens[i]]||0)+1; }

    var scores = { HEAD:0, HEART:0, GUT:0 };
    var matched = { HEAD:[], HEART:[], GUT:[] };
    var centres = ['HEAD','HEART','GUT'];

    centres.forEach(function(centre){
      var lex = LEXICONS[centre];
      Object.keys(lex).forEach(function(term){
        var c = counts[term]||0;
        if(c>0){ scores[centre]+=lex[term]*Math.min(c,3); matched[centre].push(term); }
      });
      var ph = PHRASES[centre];
      Object.keys(ph).forEach(function(term){
        var c = countPhrase(lower, term);
        if(c>0){ scores[centre]+=ph[term]*Math.min(c,3); matched[centre].push(term); }
      });
    });

    var q = (text.match(/\?/g)||[]).length;
    var ex = (text.match(/!/g)||[]).length;
    var caps = (text.match(/\b[A-Z]{3,}\b/g)||[]).length;
    var modalCount=0, peopleCount=0, j;
    for(j=0;j<MODALS.length;j++){ modalCount += counts[MODALS[j]]||0; }
    for(j=0;j<PEOPLE.length;j++){ peopleCount += counts[PEOPLE[j]]||0; }

    var signals = {
      questionMarks: Math.min(q,3), modals: Math.min(modalCount,4),
      exclaims: Math.min(ex,3), capsWords: Math.min(caps,3), peopleRefs: Math.min(peopleCount,6)
    };
    scores.HEAD  += signals.questionMarks*1.0 + signals.modals*0.5;
    scores.GUT   += signals.exclaims*1.2 + signals.capsWords*1.0;
    scores.HEART += signals.peopleRefs*0.5;

    centres.forEach(function(c){ scores[c]=Math.round(scores[c]*100)/100; });
    var total = Math.round((scores.HEAD+scores.HEART+scores.GUT)*100)/100;

    var priority = { HEAD:3, GUT:2, HEART:1 };
    var doorway='HEAD', best=-1;
    centres.forEach(function(c){
      if(scores[c]>best || (scores[c]===best && priority[c]>priority[doorway])){ best=scores[c]; doorway=c; }
    });
    if(total<=0){ doorway='HEAD'; }
    var confidence = total>0 ? Math.round((best/total)*100)/100 : 0;

    return { doorway:doorway, scores:scores, total:total, confidence:confidence, signals:signals, matched:matched, wedge:WEDGES[doorway] };
  }

  return { classify:classify, WEDGES:WEDGES, LEXICONS:LEXICONS, PHRASES:PHRASES };
});

/* =============================================================================
   THE CANVAS  —  node store, rendering, drag, wiring, and the guided flow.
   The system's ONLY generated output is (a) the mechanical read-out and
   (b) the Wedge prompt that asks the user to create a new node. No advice.
   ============================================================================= */
(function () {
  'use strict';
  var SilentRead = window.SilentRead;
  var canvas = document.getElementById('canvas');
  var wires = document.getElementById('wires');
  var emptyHint = document.getElementById('emptyHint');
  var CENTRE_COLOR = { HEAD: 'var(--blue)', HEART: 'var(--pink)', GUT: 'var(--orange)' };

  var state = { nodes: {}, edges: [], seq: 1, els: {}, drag: null, linkFrom: null };

  function uid(p) { return (p || 'n') + (state.seq++); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  function addNode(node) {
    node.id = node.id || uid();
    node.x = node.x == null ? 120 : node.x;
    node.y = node.y == null ? 120 : node.y;
    state.nodes[node.id] = node;
    renderNode(node);
    refreshHint();
    return node;
  }
  function addEdge(from, to, flow) {
    if (from === to) { return; }
    var exists = state.edges.some(function (e) {
      return (e.from === from && e.to === to) || (e.from === to && e.to === from);
    });
    if (exists) { return; }
    state.edges.push({ id: uid('e'), from: from, to: to, flow: !!flow });
    drawWires();
  }
  function removeNode(id) {
    var el = state.els[id];
    if (el) { el.remove(); }
    delete state.els[id]; delete state.nodes[id];
    state.edges = state.edges.filter(function (e) { return e.from !== id && e.to !== id; });
    drawWires(); refreshHint();
  }

  /* ---- rendering -------------------------------------------------------- */
  function renderNode(node) {
    var el = document.createElement('div');
    el.className = 'node t-' + node.type;
    el.dataset.id = node.id;
    el.style.left = node.x + 'px';
    el.style.top = node.y + 'px';
    el.innerHTML = bodyHTML(node);
    canvas.appendChild(el);
    state.els[node.id] = el;
    wire(node, el);
    autosize(el.querySelector('textarea'));
    drawWires();
  }

  function bodyHTML(node) {
    if (node.type === 'wedge') {
      var w = node.wedge;
      return head(node, 'WEDGE', readoutLabel(node.read)) +
        '<div class="node__body">' +
          '<div class="node__prompt"><span class="lead">System prompt · ' + esc(w.from) + ' → ' + esc(w.to) + '</span>' + esc(w.prompt) + '</div>' +
          scorebar(node.read) +
          '<div class="row"><button class="cta" data-act="spawn">' + esc(w.cta) + ' →</button></div>' +
        '</div>';
    }
    var ph = {
      friction: 'Type the raw friction. What is actually happening right now, in your own words.',
      'physical-action': 'Name the physical action. Where it lands in the body, or the one thing the hands can do.',
      'structural-risk': 'Name the structural risk. The predictive simulation if this fails.',
      free: 'Free node.'
    }[node.type] || 'Node.';
    var tag = { friction: 'Current Friction', 'physical-action': 'Physical Action', 'structural-risk': 'Structural Risk', free: 'Node' }[node.type] || 'Node';
    var foot = '';
    if (node.type === 'friction') {
      foot = '<div class="row"><button class="cta" data-act="read">Run the Silent Read →</button>' +
             '<span class="kbd">⌘ / Ctrl + Enter</span></div>' +
             (node.read ? scorebar(node.read) : '');
    }
    return head(node, tag, node.type === 'friction' && node.read ? readoutLabel(node.read) : '') +
      '<div class="node__body"><textarea data-input placeholder="' + esc(ph) + '">' + esc(node.text || '') + '</textarea>' + foot + '</div>';
  }

  function head(node, tag, readout) {
    var canLink = node.type !== 'wedge';
    return '<div class="node__head" data-drag>' +
      '<span class="node__tag">' + esc(tag) + '</span>' +
      (readout ? '<span class="node__readout">' + readout + '</span>' : '') +
      '<span class="node__spacer"></span>' +
      (canLink ? '<button class="node__btn" data-act="link" title="Link to another node">⛓</button>' : '') +
      '<button class="node__btn" data-act="del" title="Delete node">×</button>' +
      '</div>';
  }

  function readoutLabel(read) {
    if (!read) { return ''; }
    return 'READ · <span style="color:' + CENTRE_COLOR[read.doorway] + '">' + read.doorway + '</span> · conf ' + read.confidence.toFixed(2);
  }

  function scorebar(read) {
    if (!read) { return ''; }
    var max = Math.max(read.scores.HEAD, read.scores.HEART, read.scores.GUT, 1);
    function seg(c, color) {
      var pct = Math.round((read.scores[c] / max) * 100);
      return '<div class="seg" title="' + c + ' ' + read.scores[c] + '"><i style="background:' + color + ';transform:scaleX(' + (pct / 100) + ')"></i></div>';
    }
    return '<div class="scorebar">' + seg('HEAD', 'var(--blue)') + seg('HEART', 'var(--pink)') + seg('GUT', 'var(--orange)') + '</div>';
  }

  /* ---- event wiring per node ------------------------------------------- */
  function wire(node, el) {
    el.addEventListener('pointerdown', function (e) {
      // linking takes precedence over drag/edit
      if (state.linkFrom && state.linkFrom !== node.id) {
        addEdge(state.linkFrom, node.id, false);
        endLink();
        e.preventDefault();
        return;
      }
    });

    var handle = el.querySelector('[data-drag]');
    handle.addEventListener('pointerdown', function (e) {
      if (e.target.closest('[data-act]')) { return; }
      if (state.linkFrom) { return; }
      startDrag(node, el, e);
    });

    el.querySelectorAll('[data-act]').forEach(function (b) {
      b.addEventListener('click', function (e) {
        e.stopPropagation();
        var act = b.dataset.act;
        if (act === 'del') { removeNode(node.id); }
        else if (act === 'link') { beginLink(node.id); }
        else if (act === 'read') { runRead(node); }
        else if (act === 'spawn') { spawnResponse(node); }
      });
    });

    var ta = el.querySelector('[data-input]');
    if (ta) {
      ta.addEventListener('input', function () { node.text = ta.value; autosize(ta); drawWires(); });
      ta.addEventListener('keydown', function (e) {
        if ((e.metaKey || e.ctrlKey) && e.key === 'Enter' && node.type === 'friction') {
          e.preventDefault(); runRead(node);
        }
      });
      ta.addEventListener('pointerdown', function (e) { if (!state.linkFrom) { e.stopPropagation(); } });
    }
  }

  function autosize(ta) {
    if (!ta) { return; }
    ta.style.height = 'auto';
    ta.style.height = Math.max(58, ta.scrollHeight) + 'px';
  }

  /* ---- drag ------------------------------------------------------------- */
  function startDrag(node, el, e) {
    el.setPointerCapture(e.pointerId);
    state.drag = { node: node, el: el, dx: e.clientX - node.x, dy: e.clientY - node.y, pid: e.pointerId };
    el.style.zIndex = 5;
    var move = function (ev) {
      if (!state.drag) { return; }
      node.x = Math.max(4, ev.clientX - state.drag.dx);
      node.y = Math.max(4, ev.clientY - state.drag.dy);
      el.style.left = node.x + 'px';
      el.style.top = node.y + 'px';
      drawWires();
    };
    var up = function () {
      el.style.zIndex = 2;
      state.drag = null;
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  }

  /* ---- linking ---------------------------------------------------------- */
  function beginLink(id) {
    if (state.linkFrom) { endLink(); }
    state.linkFrom = id;
    canvas.style.cursor = 'crosshair';
    Object.keys(state.els).forEach(function (k) {
      if (k !== id) { state.els[k].classList.add('linkable'); }
    });
    setHint('Linking — click any node to connect, or click empty space to cancel.');
  }
  function endLink() {
    state.linkFrom = null;
    canvas.style.cursor = 'default';
    Object.keys(state.els).forEach(function (k) { state.els[k].classList.remove('linkable'); });
    refreshHint();
  }

  /* ---- the guided flow -------------------------------------------------- */
  function runRead(node) {
    var read = SilentRead.classify(node.text || '');
    node.read = read;
    // re-render friction head/footer to show the read-out + scorebar
    var el = state.els[node.id];
    el.innerHTML = bodyHTML(node);
    wire(node, el);
    autosize(el.querySelector('textarea'));

    // create or update the single Wedge node attached to this friction
    var wedgeNode = findChildWedge(node.id);
    var wx = node.x + 360, wy = node.y;
    if (!wedgeNode) {
      wedgeNode = addNode({ id: uid(), type: 'wedge', x: clampX(wx), y: wy, parent: node.id, wedge: read.wedge, read: read });
      addEdge(node.id, wedgeNode.id, true);
    } else {
      wedgeNode.wedge = read.wedge; wedgeNode.read = read;
      var wel = state.els[wedgeNode.id];
      wel.className = 'node t-wedge';
      wel.innerHTML = bodyHTML(wedgeNode);
      wire(wedgeNode, wel);
    }
    drawWires();
    setHint('Silent Read → <b>' + read.doorway + '</b>. The Wedge forces you to <b>' + read.wedge.to + '</b>. Add the node it asks for.');
  }

  function spawnResponse(wedgeNode) {
    var w = wedgeNode.wedge;
    var rx = clampX(wedgeNode.x + 360), ry = wedgeNode.y + 30;
    var resp = addNode({ id: uid(), type: w.responseType, x: rx, y: ry, parent: wedgeNode.id, text: '' });
    addEdge(wedgeNode.id, resp.id, false);
    var ta = state.els[resp.id].querySelector('textarea');
    if (ta) { ta.focus(); }
    setHint('Node added in your <b>' + w.to + '</b> centre. Name it — that is the wedge. Reset to run another friction.');
  }

  function findChildWedge(parentId) {
    var found = null;
    Object.keys(state.nodes).forEach(function (k) {
      var n = state.nodes[k];
      if (n.type === 'wedge' && n.parent === parentId) { found = n; }
    });
    return found;
  }

  function clampX(x) { return Math.min(x, window.innerWidth - 320); }

  /* ---- wires ------------------------------------------------------------ */
  function anchors(id) {
    var el = state.els[id];
    if (!el) { return null; }
    var l = el.offsetLeft, t = el.offsetTop, w = el.offsetWidth, h = el.offsetHeight;
    return { l: l, r: l + w, t: t, b: t + h, cx: l + w / 2, cy: t + h / 2 };
  }
  function drawWires() {
    var d = '';
    state.edges.forEach(function (e) {
      var a = anchors(e.from), b = anchors(e.to);
      if (!a || !b) { return; }
      var x1, y1, x2, y2;
      if (b.cx >= a.cx) { x1 = a.r; y1 = a.cy; x2 = b.l; y2 = b.cy; }
      else { x1 = a.l; y1 = a.cy; x2 = b.r; y2 = b.cy; }
      var dx = Math.max(40, Math.abs(x2 - x1) * 0.5);
      var cls = e.flow ? ' class="flow"' : '';
      d += '<path' + cls + ' d="M ' + x1 + ' ' + y1 + ' C ' + (x1 + (x2 >= x1 ? dx : -dx)) + ' ' + y1 + ', ' + (x2 - (x2 >= x1 ? dx : -dx)) + ' ' + y2 + ', ' + x2 + ' ' + y2 + '"/>';
    });
    wires.innerHTML = d;
  }

  /* ---- hint / chrome ---------------------------------------------------- */
  var defaultHint = document.getElementById('hint').innerHTML;
  function setHint(html) { document.getElementById('hint').innerHTML = html; }
  function refreshHint() {
    if (state.linkFrom) { return; }
    setHint(defaultHint);
    emptyHint.style.display = Object.keys(state.nodes).length <= 1 ? 'block' : 'none';
  }

  /* ---- canvas-level interactions --------------------------------------- */
  canvas.addEventListener('pointerdown', function (e) {
    if (e.target === canvas || e.target === wires || e.target === emptyHint) {
      if (state.linkFrom) { endLink(); }
    }
  });
  canvas.addEventListener('dblclick', function (e) {
    if (e.target !== canvas && e.target !== wires && e.target !== emptyHint) { return; }
    addNode({ id: uid(), type: 'free', x: e.clientX - 150, y: e.clientY - 56 - 20, text: '' });
    var ids = Object.keys(state.nodes);
    var last = state.els[ids[ids.length - 1]];
    var ta = last && last.querySelector('textarea'); if (ta) { ta.focus(); }
  });

  document.getElementById('resetBtn').addEventListener('click', reset);
  window.addEventListener('resize', drawWires);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && state.linkFrom) { endLink(); } });

  function reset() {
    Object.keys(state.els).forEach(function (k) { state.els[k].remove(); });
    state = { nodes: {}, edges: [], seq: 1, els: {}, drag: null, linkFrom: null };
    wires.innerHTML = '';
    seedFriction();
    refreshHint();
  }

  function seedFriction() {
    addNode({ id: uid(), type: 'friction', x: 96, y: 60, text: '' });
  }

  /* ---- boot ------------------------------------------------------------- */
  seedFriction();
  refreshHint();
})();
</script>
</body>
</html>
